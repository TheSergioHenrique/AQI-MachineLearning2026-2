<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Previsão da Qualidade do Ar :: Mapa</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-pagina="mapa">
<div id="pagina">
  <div id="topo"></div>

  <div id="conteudo">
    <div id="lateral"></div>

    <div id="principal">
      <h1 class="titulo-pagina">Mapa da Qualidade do Ar</h1>
      <p class="subtitulo">Qualidade do ar nas 26 cidades monitoradas. Clique em um marcador para ver os detalhes.</p>

      <form id="filtros">
        <fieldset>
          <legend>Exibição</legend>
          <label for="data">Data de referência:</label>
          <input type="date" id="data">
          <label>Mostrar:</label>
          <label class="opcao"><input type="radio" name="modo" value="previsao" checked> Previsão (amanhã)</label>
          <label class="opcao"><input type="radio" name="modo" value="medido"> Medido (hoje)</label>
          <input type="submit" class="botao" value="Atualizar">
        </fieldset>
      </form>

      <div id="mapa"></div>
      <div id="resultado"><div class="carregando">Carregando...</div></div>
    </div>
  </div>

  <div id="rodape-ph"></div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/mapa-dados.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/comum.js"></script>
<script src="js/layout.js"></script>
<script>
(function () {
  var inpData = document.getElementById('data');
  var alvo = document.getElementById('resultado');

  var mapa = L.map('mapa', { scrollWheelZoom: false, zoomSnap: 0.25 });
  var pontos = Object.keys(AQI.COORDENADAS).map(function (c) { return AQI.COORDENADAS[c]; });
  mapa.fitBounds(pontos, { padding: [20, 20] });
  mapa.setMinZoom(4); mapa.setMaxZoom(8);
  L.geoJSON(MAPA_PAISES, {
    interactive: false,
    style: function (f) {
      return f.properties.india
        ? { color: '#7a6a3a', weight: 1.5, fillColor: '#f6f0d8', fillOpacity: 1 }
        : { color: '#a0a0a0', weight: 1, fillColor: '#e2e2dc', fillOpacity: 1 };
    }
  }).addTo(mapa);
  mapa.attributionControl.addAttribution('Contornos: Natural Earth');

  var legenda = L.control({ position: 'bottomright' });
  legenda.onAdd = function () {
    var div = L.DomUtil.create('div', 'legenda-mapa');
    div.innerHTML = '<b>Categoria do AQI</b>' + AQI.FAIXAS.map(function (f) {
      return '<i style="background:' + f.cor + '"></i>' + f.nome;
    }).join('<br>') + '<br><i style="background:#ccc"></i>Sem dados' +
      '<br><br>&#9650; deve piorar<br>&#9660; deve melhorar<br>= deve se manter';
    return div;
  };
  legenda.addTo(mapa);

  var camada = L.layerGroup().addTo(mapa);
  var ROTULO_ESQ = { Gurugram: 1, Bengaluru: 1, Ernakulam: 1, Kochi: 1, Brajrajnagar: 1, Thiruvananthapuram: 1 };

  function modo() {
    return document.querySelector('input[name=modo]:checked').value;
  }

  function seta(c) {
    if (c.categoria_prevista === null || c.categoria_atual === null) return '?';
    var d = c.categoria_prevista - c.categoria_atual;
    return d > 0 ? '&#9650;' : d < 0 ? '&#9660;' : '=';
  }

  function nivel(v) {
    return v === null ? -1 : v;
  }

  function consulta() {
    var data = inpData.value, previsao = modo() === 'previsao';
    var dataAmanha = Util.diaSeguinte(data);
    alvo.innerHTML = '<div class="carregando">Carregando cidades...</div>';

    AQI.mapa(data).then(function (lista) {
      camada.clearLayers();

      lista.forEach(function (c) {
        var pos = AQI.COORDENADAS[c.cidade];
        if (!pos) return;
        var f = Util.faixa(previsao ? c.categoria_prevista : c.categoria_atual) || { cor: '#ccc', texto: '#555' };
        var texto = previsao ? seta(c) : c.aqi_atual === null ? '?' : Math.round(c.aqi_atual);
        var icone = L.divIcon({
          className: '',
          html: '<div class="marcador-aqi" style="width:32px;height:32px;line-height:28px;background:' + f.cor + ';color:' + f.texto + '">' + texto + '</div>',
          iconSize: [32, 32], iconAnchor: [16, 16], popupAnchor: [0, -14]
        });
        L.marker(pos, { icon: icone, title: c.cidade, riseOnHover: true })
          .bindPopup(
            '<h4>' + c.cidade + '</h4>' +
            'Hoje (' + Util.formataData(data) + '): <b>' + Util.numero(c.aqi_atual) + '</b> ' + Util.selo(c.categoria_atual) + '<br>' +
            'Amanhã (' + Util.formataData(dataAmanha) + '): ' + Util.selo(c.categoria_prevista) + '<br><br>' +
            '<a href="index.html?cidade=' + encodeURIComponent(c.cidade) + '&data=' + data + '">Ver previsão detalhada &raquo;</a>')
          .bindTooltip(c.cidade, {
            permanent: true, className: 'rotulo-cidade',
            direction: ROTULO_ESQ[c.cidade] ? 'left' : 'right',
            offset: ROTULO_ESQ[c.cidade] ? [-14, 0] : [14, 0]
          })
          .addTo(camada);
      });

      var ord = lista.slice().sort(function (a, b) {
        var pa = previsao ? nivel(a.categoria_prevista) : nivel(a.categoria_atual);
        var pb = previsao ? nivel(b.categoria_prevista) : nivel(b.categoria_atual);
        return pb - pa || nivel(b.aqi_atual) - nivel(a.aqi_atual);
      });
      var html = '<h2>Ranking das cidades (' + (previsao ? 'previsão para ' + Util.formataData(dataAmanha) : 'medido em ' + Util.formataData(data)) + ')</h2>' +
        '<table class="dados"><tr><th>#</th><th>Cidade</th><th>AQI hoje</th><th>Categoria hoje</th><th>Previsão amanhã</th></tr>';
      ord.forEach(function (c, i) {
        html += '<tr><td class="num">' + (i + 1) + '</td><td><a href="index.html?cidade=' + encodeURIComponent(c.cidade) + '&data=' + data + '">' + c.cidade + '</a></td>' +
          '<td class="num">' + Util.numero(c.aqi_atual) + '</td><td>' + Util.selo(c.categoria_atual) + '</td><td>' + Util.selo(c.categoria_prevista) + '</td></tr>';
      });
      alvo.innerHTML = html + '</table>';
    }).catch(function (e) { Util.erro(alvo, e); });
  }

  document.getElementById('filtros').onsubmit = function (e) { e.preventDefault(); consulta(); };
  Array.prototype.forEach.call(document.querySelectorAll('input[name=modo]'), function (r) { r.onchange = consulta; });
  Util.preparaData(inpData).then(consulta).catch(function (e) { Util.erro(alvo, e); });
})();
</script>
</body>
</html>
